# =============================================================
#  Movie App Server — Application Configuration
#  Spring Boot 3.3 | Java 17 | MySQL 8.0+
# =============================================================

# ----- SERVER -----
server.port=8080

# ----- DATASOURCE -----
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/movie_app_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ----- JPA / HIBERNATE -----
# update   = tu dong tao moi / cap nhat bang theo Entity (dung khi dev)
# validate = chi kiem tra, khong thay doi bang (dung khi production)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Giu nguyen ten bang/cot (khop voi schema.sql da thiet ke)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ----- JACKSON (JSON) -----
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ----- LOGGING -----
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.movie_app_server=DEBUG
