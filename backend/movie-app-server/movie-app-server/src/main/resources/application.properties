# 1. Tăng thời gian kiểm tra kết nối ngầm (Mặc định là 30000ms = 30 giây)
# Tăng lên 15 phút (900000ms) để giảm số lần gửi lệnh SELECT 1 lên TiDB
spring.datasource.hikari.keepalive-time=900000

# 2. Giảm số lượng kết nối duy trì sẵn trong Pool (Mặc định thường là 10)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5

# 3. Tự động giải phóng các kết nối không dùng đến sau 5 phút
spring.datasource.hikari.idle-timeout=300000

# 4. Timeout kết nối (30 giây)
spring.datasource.hikari.connection-timeout=30000

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
