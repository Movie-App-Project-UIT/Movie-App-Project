spring.application.name=movie-app-server

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/movieapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
#Thay thế tên username và password trên MySQL của mình vào nha
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#Thay bằng token của mình trên TMDB sau khi đăng kí được. Hoặc nếu không thì có thể dùng luôn token này cũng đưược.
tmdb.token=${API_READ_ACCESS_TOKEN:}
tmdb.base-url=https://api.themoviedb.org/3

#Cấu hình cloudinary
cloudinary.cloud-name=${CLOUDNAME:}
cloudinary.api-key=${CLOUD_API_KEY:}
cloudinary.api-secret=${CLOUD_API_SECRET:}

#Tăng giới hạn upload video
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB

#Cấu hình imagekit
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY:}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:}

spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

cloudinary.folder.videos=movie_app/videos
cloudinary.folder.subtitles=movie_app/subtitles

