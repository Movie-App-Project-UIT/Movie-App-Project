spring.application.name=movie-app-server

spring.datasource.url=jdbc:mysql://localhost:3306/movieapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
#Thay thế tên username và password của mình vào nha
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

tmdb.token=${API_READ_ACCESS_TOKEN:}
tmdb.base-url=https://api.themoviedb.org/3


spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true